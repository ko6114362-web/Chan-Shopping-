name: Build Chan Shop APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Chan Shop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          mkdir -p source
          unzip -q ChanShopAndroid_KBZPay_Project.zip -d source
          ls -la source

      - name: Build APK
        run: |
          SETTINGS_FILE=$(find source -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: Android project not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            python3 -c '
import pathlib
p = pathlib.Path("'"$APP_GRADLE"'")
txt = p.read_text(encoding="utf-8")
if "jvmTarget" not in txt:
    block = """
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
"""
    txt = txt.replace("buildFeatures {", block + "\n    buildFeatures {", 1)
    p.write_text(txt, encoding="utf-8")
'
          fi
          echo "Building inside: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug -Dorg.gradle.java.home=$JAVA_HOME --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chan-Shop-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
